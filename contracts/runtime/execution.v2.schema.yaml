schema:
  id: runtime.execution.schema
  version: 2.0.0
  contract_version: 2.0.0

ExecutionRequest:
  required:
    - request_id
    - action
    - timeout_ms
  fields:
    request_id: string
    action: string
    timeout_ms:
      type: integer
      minimum: 1
      unit: milliseconds
      semantics: "Execution deadline budget enforced by the runtime boundary."

ActionExecutor:
  operation: execute
  input:
    action: string
  output: action_completion
  requirements:
    - "Must be asynchronous and cancellation-cooperative."
    - "Must document external side effects and cancellation guarantees."
  runtime_deadline_behavior:
    confirmed_cancellation: EXECUTION_TIMEOUT
    cancellation_unconfirmed: EXECUTION_STATE_UNKNOWN

AuditEvent:
  required:
    - request_id
    - action
    - success
    - error_code
  fields:
    request_id: string
    action: string
    success: boolean
    error_code: string|null

AuditSink:
  operation: emit
  input: AuditEvent
  output: evidence_reference
  failure: "Raises or reports failure when the event is not accepted."

ExecutionResult:
  required:
    - request_id
    - success
  fields:
    request_id: string
    success: boolean
    error_code: string|null
    evidence_reference: string|null
  error_codes:
    - INVALID_REQUEST
    - INVALID_ACTION
    - INVALID_TIMEOUT
    - EXECUTION_FAILURE
    - EXECUTION_TIMEOUT
    - EXECUTION_STATE_UNKNOWN
    - AUDIT_SINK_FAILURE
